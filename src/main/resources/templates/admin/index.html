<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('仪表盘')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('dashboard')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>仪表盘</h1>
            <div class="user-info">
                <span th:text="'欢迎，' + ${session.user.username}"></span>
            </div>
        </div>

        <div class="page-content">
            <div class="dashboard-section fade-in">
                <div class="section-title">📊 今日数据</div>
                <div class="stats-grid">
                    <div class="stat-card card-primary">
                        <div class="stat-header">
                            <span class="stat-label">今日新增商品</span>
                            <div class="stat-icon">📦</div>
                        </div>
                        <div class="stat-value" th:text="${todayNewProducts}">0</div>
                    </div>
                    <div class="stat-card card-success">
                        <div class="stat-header">
                            <span class="stat-label">今日订单数</span>
                            <div class="stat-icon">📋</div>
                        </div>
                        <div class="stat-value" th:text="${todayOrders}">0</div>
                    </div>
                    <div class="stat-card card-info">
                        <div class="stat-header">
                            <span class="stat-label">今日新增用户</span>
                            <div class="stat-icon">👥</div>
                        </div>
                        <div class="stat-value" th:text="${todayNewUsers}">0</div>
                    </div>
                    <div class="stat-card card-warning">
                        <div class="stat-header">
                            <span class="stat-label">今日销售额</span>
                            <div class="stat-icon">💰</div>
                        </div>
                        <div class="stat-value" th:text="'¥' + ${#numbers.formatDecimal(todaySales, 1, 2)}">¥0.00</div>
                    </div>
                </div>
            </div>

            <div class="dashboard-section fade-in">
                <div class="section-title">📈 总体统计</div>
                <div class="stats-grid">
                    <div class="stat-card card-primary">
                        <div class="stat-header">
                            <span class="stat-label">商品总数</span>
                            <div class="stat-icon">📦</div>
                        </div>
                        <div class="stat-value" th:text="${totalProducts}">0</div>
                    </div>
                    <div class="stat-card card-purple">
                        <div class="stat-header">
                            <span class="stat-label">分类数量</span>
                            <div class="stat-icon">🏷️</div>
                        </div>
                        <div class="stat-value" th:text="${totalCategories}">0</div>
                    </div>
                    <div class="stat-card card-success">
                        <div class="stat-header">
                            <span class="stat-label">订单总数</span>
                            <div class="stat-icon">📋</div>
                        </div>
                        <div class="stat-value" th:text="${totalOrders}">0</div>
                    </div>
                    <div class="stat-card card-info">
                        <div class="stat-header">
                            <span class="stat-label">用户数量</span>
                            <div class="stat-icon">👥</div>
                        </div>
                        <div class="stat-value" th:text="${totalUsers}">0</div>
                    </div>
                </div>
            </div>

            <div class="dashboard-section fade-in">
                <div class="chart-container">
                    <div class="chart-header">
                        <div class="chart-title">📈 近 7 天销售趋势</div>
                    </div>
                    <div id="chartLoading" class="loading">加载图表数据...</div>
                    <canvas id="salesTrendChart" height="80" style="display: none;"></canvas>
                    <div id="chartNoData" class="loading" style="display: none;">暂无销售趋势数据</div>
                </div>
            </div>

            <div class="dashboard-section fade-in">
                <div class="chart-container">
                    <div class="chart-header">
                        <div class="chart-title">👥 用户活跃度统计</div>
                    </div>
                    <div class="activity-stats">
                        <div class="activity-item">
                            <div class="label">今日活跃用户</div>
                            <div class="value" th:text="${userActivity.activeUsersToday} ?: 0">0</div>
                        </div>
                        <div class="activity-item">
                            <div class="label">近 7 天活跃用户</div>
                            <div class="value" th:text="${userActivity.activeUsersWeek} ?: 0">0</div>
                        </div>
                        <div class="activity-item">
                            <div class="label">近 30 天活跃用户</div>
                            <div class="value" th:text="${userActivity.activeUsersMonth} ?: 0">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-section fade-in">
                <div class="chart-container">
                    <div class="chart-header">
                        <div class="chart-title">🔥 热门商品 TOP 10</div>
                    </div>
                    <table class="hot-products-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>商品图片</th>
                                <th>商品名称</th>
                                <th>价格</th>
                                <th>销量</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product, iterStat : ${hotProducts}">
                                <td th:text="${iterStat.index + 1}">1</td>
                                <td>
                                    <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="商品图片"/>
                                    <div th:unless="${product.imageUrl}" style="width: 40px; height: 40px; background: var(--gray-100); border-radius: 8px;"></div>
                                </td>
                                <td th:text="${product.name}">商品名称</td>
                                <td th:text="'¥' + ${#numbers.formatDecimal(product.price, 1, 2)}">¥0.00</td>
                                <td>
                                    <span style="color: var(--danger); font-weight: 700;" th:text="${product.totalSold}">0</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(hotProducts)}">
                                <td colspan="5" class="empty-state">暂无销售数据</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.salesTrendData = /*[[${salesTrend}]]*/ [];
</script>
<script src="/js/chart.js"></script>
<script src="/js/admin_dashboard.js"></script>
</body>
</html>
