<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('编辑用户')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('users')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>编辑用户</h1>
            <div class="header-actions">
                <a href="/admin/users" class="btn btn-secondary">← 返回列表</a>
            </div>
        </div>

        <div class="page-content">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
                <div class="form-container">
                    <h3 style="margin-bottom:20px;font-size:16px;font-weight:600;color:var(--gray-800);">个人信息</h3>
                    <form th:action="@{/admin/user/save}" method="post">
                        <input type="hidden" name="id" th:value="${user.id}">

                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" name="username" th:value="${user.username}" required>
                        </div>

                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="email" name="email" th:value="${user.email}" required>
                        </div>

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                            <div class="form-group">
                                <label>手机号</label>
                                <input type="text" name="phone" th:value="${user.phone}">
                            </div>

                            <div class="form-group">
                                <label>角色</label>
                                <select name="role">
                                    <option value="USER" th:selected="${user.role == 'USER'}">普通用户</option>
                                    <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">管理员</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>地址</label>
                            <input type="text" name="address" th:value="${user.address}">
                        </div>

                        <div class="form-group">
                            <label>重置密码</label>
                            <input type="password" name="password" placeholder="留空则不修改密码">
                            <small style="color:var(--gray-400);font-size:12px;">如需重置密码，请输入新密码；否则留空</small>
                        </div>

                        <div class="form-group">
                            <label>注册时间</label>
                            <input type="text" th:value="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}" disabled style="background:var(--gray-50);">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存修改</button>
                            <a href="/admin/users" class="btn btn-secondary">取消</a>
                        </div>
                    </form>
                </div>

                <div>
                    <div class="stats-grid" style="margin-bottom:20px;">
                        <div class="stat-card card-primary">
                            <div class="stat-header">
                                <span class="stat-label">总订单数</span>
                                <div class="stat-icon">📋</div>
                            </div>
                            <div class="stat-value" th:text="${totalOrders}">0</div>
                        </div>
                        <div class="stat-card card-warning">
                            <div class="stat-header">
                                <span class="stat-label">累计消费</span>
                                <div class="stat-icon">💰</div>
                            </div>
                            <div class="stat-value" th:text="'¥' + ${totalSpent}">¥0</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3>最近订单</h3>
                            <a th:href="@{/admin/user/orders(id=${user.id})}" class="btn btn-sm btn-primary">查看全部</a>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>金额</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="o : ${orders}" th:if="${oStat.index < 5}">
                                        <td th:text="${o.orderNo}"></td>
                                        <td th:text="'¥' + ${o.totalAmount}"></td>
                                        <td>
                                            <span class="badge" th:classappend="${o.status == 'PENDING' ? 'badge-warning' : o.status == 'PAID' ? 'badge-info' : o.status == 'SHIPPED' ? 'badge-success' : o.status == 'COMPLETED' ? 'badge-purple' : 'badge-danger'}" th:text="${o.status == 'PENDING' ? '待支付' : o.status == 'PAID' ? '已支付' : o.status == 'SHIPPED' ? '已发货' : o.status == 'COMPLETED' ? '已完成' : '已取消'}"></span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(orders)}">
                                        <td colspan="3" style="text-align:center;color:var(--gray-400);padding:20px;">暂无订单</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
