<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('编辑分类')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('categories')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1 th:text="${category != null ? '编辑分类' : '添加分类'}"></h1>
            <div class="header-actions">
                <a href="/admin/categories" class="btn btn-secondary">← 返回列表</a>
            </div>
        </div>

        <div class="page-content">
            <div class="form-container" style="max-width: 600px;">
                <form action="/admin/category/save" method="post">
                    <input type="hidden" name="id" th:value="${category != null ? category.id : null}">

                    <div class="form-group">
                        <label>分类名称</label>
                        <input type="text" name="name" th:value="${category != null ? category.name : ''}" required>
                    </div>

                    <div class="form-group">
                        <label>描述</label>
                        <textarea name="description" rows="3" th:text="${category != null ? category.description : ''}"></textarea>
                    </div>

                    <div class="form-group">
                        <label>排序</label>
                        <input type="number" name="sortOrder" th:value="${category != null ? category.sortOrder : '0'}" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/admin/categories" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
