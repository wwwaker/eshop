<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <h2>电子商城</h2>
            <a href="/admin">首页</a>
            <a href="/admin/products">商品管理</a>
            <a href="/admin/categories">分类管理</a>
            <a href="/admin/orders">订单管理</a>
            <a href="/admin/users">用户管理</a>
            <a href="/">返回前台</a>
            <a href="/admin/logs" class="active">系统日志</a>
            <a href="/logout">退出登录</a>
        </div>
        
        <!-- 主内容 -->
        <div class="main-content">
            <div class="admin-header">
                <h1>订单管理</h1>
            </div>
            
            <div class="admin-table">
                <table>
                    <thead>
                        <tr>
                            <th>订单编号</th>
                            <th>用户</th>
                            <th>总金额</th>
                            <th>状态</th>
                            <th>下单时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.orderNo}"></td>
                            <td th:text="${order.user.username}"></td>
                            <td th:text="'¥' + ${order.totalAmount}"></td>
                            <td>
                                <span class="status-badge" th:classappend="${order.status == 'PENDING' ? 'status-pending' : 
                                      order.status == 'PAID' ? 'status-paid' : 
                                      order.status == 'SHIPPED' ? 'status-shipped' : 
                                      order.status == 'COMPLETED' ? 'status-completed' : 'status-cancelled'}"
                                      th:text="${order.status == 'PENDING' ? '待支付' : 
                                               order.status == 'PAID' ? '已支付' : 
                                               order.status == 'SHIPPED' ? '已发货' : 
                                               order.status == 'COMPLETED' ? '已完成' : '已取消'}">状态</span>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="'/order/detail?orderNo=' + ${order.orderNo}" class="btn btn-secondary">查看</a>
                                    <form th:if="${order.status == 'PAID'}" action="/admin/order/ship" method="post" style="display: inline;">
                                        <input type="hidden" name="orderId" th:value="${order.id}">
                                        <button type="submit" class="btn">发货</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
