<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('系统日志')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('logs')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>系统日志</h1>
        </div>

        <div class="page-content">
            <div class="card" style="margin-bottom:24px;">
                <div class="card-header">
                    <h3>实时运行日志：<span th:text="${currentFileName}"></span></h3>
                </div>
                <div class="card-body">
                    <div class="log-filter">
                        <form action="/admin/logs" method="get" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                            <select name="fileName" class="filter-select" onchange="this.form.submit()">
                                <option th:each="file : ${allLogFiles}"
                                        th:value="${file}"
                                        th:text="${file}"
                                        th:selected="${file == currentFileName}">
                                </option>
                            </select>
                            <select name="level" class="filter-select">
                                <option value="">全部级别</option>
                                <option value="INFO" th:selected="${currentLevel == 'INFO'}">INFO</option>
                                <option value="WARN" th:selected="${currentLevel == 'WARN'}">WARN</option>
                                <option value="ERROR" th:selected="${currentLevel == 'ERROR'}">ERROR</option>
                                <option value="DEBUG" th:selected="${currentLevel == 'DEBUG'}">DEBUG</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm">筛选</button>
                        </form>
                    </div>
                    <div class="log-container">
                        <div th:each="logLine : ${realTimeLogs}">
                            <span th:class="${logLine.contains('ERROR') ? 'log-error' : logLine.contains('WARN') ? 'log-warn' : logLine.contains('DEBUG') ? 'log-debug' : 'log-info'}" th:text="${logLine}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-toolbar">
                    <h3 style="font-size:16px;font-weight:600;">操作审计日志</h3>
                    <button class="btn btn-danger btn-sm" onclick="clearLogs()">🗑️ 清空日志</button>
                </div>

                <div class="table-toolbar" style="border-bottom:none;padding-bottom:0;">
                    <form action="/admin/logs" method="get" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                        <input type="hidden" name="fileName" th:value="${currentFileName}">
                        <div class="search-box" style="display:flex;gap:8px;align-items:center;">
                            <span class="search-icon">🔍</span>
                            <input type="text" name="searchKeyword" placeholder="搜索日志内容..." th:value="${searchKeyword}">
                        </div>
                        <select name="level" class="filter-select">
                            <option value="">全部级别</option>
                            <option value="INFO" th:selected="${currentLevel == 'INFO'}">INFO</option>
                            <option value="WARN" th:selected="${currentLevel == 'WARN'}">WARN</option>
                            <option value="ERROR" th:selected="${currentLevel == 'ERROR'}">ERROR</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">搜索</button>
                    </form>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>级别</th>
                            <th>时间</th>
                            <th>用户</th>
                            <th>请求URL</th>
                            <th>类/方法</th>
                            <th>内容</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${operateLogs}">
                            <td>
                                <span class="badge" th:classappend="${log.logLevel == 'ERROR' ? 'badge-danger' : log.logLevel == 'WARN' ? 'badge-warning' : 'badge-info'}" th:text="${log.logLevel}"></span>
                            </td>
                            <td th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}" style="white-space:nowrap;"></td>
                            <td th:text="${log.username}"></td>
                            <td th:text="${log.requestUrl}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
                            <td th:text="${log.className.length() > 20 ? log.className.substring(0, 20) + '.../' + log.methodName : log.className + '/' + log.methodName}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
                            <td th:text="${log.logContent}" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(operateLogs)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <div class="empty-icon">📝</div>
                                    <p>暂无操作日志</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination-wrapper" th:if="${totalPages > 1}">
                    <div class="pagination-info">
                        共 <strong th:text="${totalItems}">0</strong> 条记录，第 <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong> 页
                    </div>
                    <div class="pagination">
                        <a th:href="@{/admin/logs(page=0, level=${currentLevel}, searchKeyword=${searchKeyword})}" th:classappend="${currentPage == 0} ? 'disabled'">«</a>
                        <a th:href="@{/admin/logs(page=${currentPage - 1}, level=${currentLevel}, searchKeyword=${searchKeyword})}" th:classappend="${currentPage == 0} ? 'disabled'">‹</a>
                        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:if="${i >= currentPage - 3 and i <= currentPage + 3}" th:href="@{/admin/logs(page=${i}, level=${currentLevel}, searchKeyword=${searchKeyword})}" th:text="${i + 1}" th:classappend="${i == currentPage} ? 'active'"></a>
                        </th:block>
                        <a th:href="@{/admin/logs(page=${currentPage + 1}, level=${currentLevel}, searchKeyword=${searchKeyword})}" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">›</a>
                        <a th:href="@{/admin/logs(page=${totalPages - 1}, level=${currentLevel}, searchKeyword=${searchKeyword})}" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">»</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/admin_logs.js"></script>
</body>
</html>
