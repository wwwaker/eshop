<head th:replace="~{layout :: head('我的订单')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="main">
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">
                    <span th:if="${viewingUser != null}">
                        <span th:text="${viewingUser.username}"></span> 的订单
                    </span>
                <span th:unless="${viewingUser != null}">我的订单</span>
            </h2>
            <div th:if="${viewingUser != null}">
                <a th:href="@{/admin/user/edit(id=${viewingUser.id})}" class="btn btn-secondary">返回用户编辑</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" style="text-align: center; padding: 50px; background: white; border-radius: 8px;">
            <p style="color: #999; margin-bottom: 20px;">暂无订单</p>
            <a href="/" class="btn">去购物</a>
        </div>

        <div class="order-list" th:if="${!#lists.isEmpty(orders)}">
            <p style="color: #999; margin-bottom: 20px;">暂无订单</p>
        </div>
    </div>
</main>
