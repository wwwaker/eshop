<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('首页')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="main">
    <div class="container">
        <h2 th:if="${currentCategory != null}" th:text="${currentCategory.name}">分类名称</h2>
        <h2 th:if="${keyword != null}" th:text="'搜索结果: ' + ${keyword}">搜索结果</h2>
        <h2 th:if="${currentCategory == null && keyword == null}">热门商品</h2>

        <div class="product-grid">
            <div class="product-card" th:each="product : ${products}">
                <a th:href="'/product?id=' + ${product.id}" style="text-decoration: none">
                    <div class="product-image">
                        <img th:if="${imageExistsMap[product.id]}"
                             th:src="${product.imageUrl}"
                             style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;"
                             alt="商品图片"/>
                        <span th:unless="${imageExistsMap[product.id]}">商品图片</span>
                    </div>
                </a>
                <div class="product-info">
                    <div class="product-name" th:text="${product.name}">商品名称</div>
                    <div class="product-price" th:text="'¥' + ${product.price}">¥0.00</div>
                    <div class="product-stock" th:text="'库存: ' + ${product.stock}">库存: 0</div>
                    <form action="/cart/add" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="btn">加入购物车</button>
                    </form>
                </div>
                <div class="product-hover-panel">
                    <div class="product-hover-header">
                        <span class="product-hover-label">商品详情</span>
                        <span class="product-hover-price" th:text="'¥' + ${product.price}">¥0.00</span>
                    </div>
                    <div class="product-hover-name" th:text="${product.name}">商品名称</div>
                    <div class="product-hover-description"
                         th:text="${#strings.isEmpty(product.description) ? '暂无商品描述' : product.description}">
                        商品描述
                    </div>
                    <div class="product-hover-meta">
                        <div class="product-hover-item">
                            <span class="product-hover-key">价格</span>
                            <span class="product-hover-value accent" th:text="'¥' + ${product.price}">¥0.00</span>
                        </div>
                        <div class="product-hover-item">
                            <span class="product-hover-key">库存</span>
                            <span class="product-hover-value" th:text="${product.stock}">0</span>
                        </div>
                        <div class="product-hover-item">
                            <span class="product-hover-key">分类</span>
                            <span class="product-hover-value"
                                  th:text="${#strings.isEmpty(product.categoryName) ? '未分类' : product.categoryName}">
                                未分类
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 50px; color: #999;">
            暂无商品
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
    </div>
</footer>
</body>
</html>
