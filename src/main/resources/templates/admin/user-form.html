<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('编辑用户')}"></head>
</head>
<body>
<div th:replace="~{layout :: header}"></div>

<main class="main">
    <div class="container">
        <h2 style="margin-bottom: 20px;">编辑用户</h2>

        <div th:if="${error}" style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 20px;" th:text="${error}"></div>

        <!-- 用户信息表单 -->
        <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-bottom: 20px;">个人信息</h3>
            <form th:action="@{/admin/user/save}" method="post">
                <input type="hidden" name="id" th:value="${user.id}">

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">用户名：</label>
                    <input type="text" name="username" th:value="${user.username}" required
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">邮箱：</label>
                    <input type="email" name="email" th:value="${user.email}" required
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">手机号：</label>
                    <input type="text" name="phone" th:value="${user.phone}"
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">地址：</label>
                    <input type="text" name="address" th:value="${user.address}"
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">角色：</label>
                    <select name="role" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="USER" th:selected="${user.role == 'USER'}">普通用户</option>
                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">管理员</option>
                        <option value="VIP" th:selected="${user.role == 'VIP'}">VIP 用户</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">重置密码：</label>
                    <input type="password" name="password" placeholder="留空则不修改密码"
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    <small style="color: #999;">如需重置密码，请输入新密码；否则留空</small>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">注册时间：</label>
                    <input type="text" th:value="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}" disabled
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: #f5f5f5;">
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <button type="submit" class="btn" style="padding: 12px 40px; font-size: 16px; margin-right: 10px;">保存修改</button>
                    <a href="/admin/users" class="btn btn-secondary" style="padding: 12px 40px; font-size: 16px;">返回列表</a>
                </div>
            </form>
        </div>

        <!-- 订单统计信息 -->
        <div style="background: white; padding: 20px; border-radius: 8px;">
            <h3 style="margin-bottom: 20px;">订单统计</h3>
            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center;">
                    <h4 style="margin: 0; font-size: 14px; opacity: 0.9;">总订单数</h4>
                    <p style="font-size: 36px; font-weight: bold; margin: 10px 0 0 0;" th:text="${totalOrders}">0</p>
                </div>
                <div style="flex: 1; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; border-radius: 8px; text-align: center;">
                    <h4 style="margin: 0; font-size: 14px; opacity: 0.9;">累计消费</h4>
                    <p style="font-size: 36px; font-weight: bold; margin: 10px 0 0 0;" th:text="'¥' + ${totalSpent}">¥0</p>
                </div>
            </div>

            <div style="text-align: center;">
                <a th:href="@{/admin/user/orders(id=${user.id})}" class="btn" style="padding: 12px 40px; font-size: 16px;">查看该用户的所有订单</a>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
    </div>
</footer>
</body>
</html>
