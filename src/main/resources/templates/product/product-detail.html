<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${product.name})}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    
    <main class="main">
        <div class="container">
            <div class="product-detail">
                <div class="product-detail-image">
                    <div class="image-container">
                        <img th:if="${imageExists}" th:src="${product.imageUrl}" />
                        <span th:unless="${imageExists}">商品图片</span>
                    </div>
                </div>
                <div class="product-detail-info">
                    <h1 th:text="${product.name}">商品名称</h1>
                    <p th:text="${product.description}">商品描述</p>
                    <div class="product-price-large" th:text="'¥' + ${product.price}">¥0.00</div>
                    <div class="product-meta">
                        <span>库存: </span>
                        <span th:text="${product.stock}">0</span>
                    </div>
                    <div class="product-meta">
                        <span>分类: </span>
                        <span th:text="${product.categoryName}">分类</span>
                    </div>
                    <form action="/cart/add" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="quantity-control">
                            <label>数量:</label>
                            <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                        </div>
                        <button type="submit" class="btn">加入购物车</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
        </div>
    </footer>
</body>
</html>
