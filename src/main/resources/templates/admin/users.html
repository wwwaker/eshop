<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('用户管理')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('users')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>用户管理</h1>
        </div>

        <div class="page-content">
            <div class="table-container">
                <div class="table-toolbar">
                    <form action="/admin/users" method="get" class="search-box" style="display:flex;gap:8px;align-items:center;">
                        <span class="search-icon">🔍</span>
                        <input type="text" name="keyword" placeholder="搜索用户名/邮箱..." th:value="${keyword}">
                    </form>
                    <div class="filter-group">
                        <form action="/admin/users" method="get" style="display:flex;gap:8px;align-items:center;">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <select name="role" class="filter-select" onchange="this.form.submit()">
                                <option value="">全部角色</option>
                                <option value="ADMIN" th:selected="${role == 'ADMIN'}">管理员</option>
                                <option value="USER" th:selected="${role == 'USER'}">普通用户</option>
                            </select>
                        </form>
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>手机号</th>
                            <th>角色</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.phone}"></td>
                            <td>
                                <span class="badge" th:classappend="${u.role == 'ADMIN'} ? 'badge-info' : 'badge-success'"
                                      th:text="${u.role == 'ADMIN'} ? '管理员' : '普通用户'"></span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}"></td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="'/admin/user/edit?id=' + ${u.id}" class="btn btn-secondary btn-sm">编辑</a>
                                    <form th:action="@{/admin/user/delete}" method="post" style="display:inline;">
                                        <input type="hidden" name="id" th:value="${u.id}">
                                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('确定删除该用户吗？')">删除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-icon">👥</div>
                                    <p>暂无用户数据</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination-wrapper" th:if="${totalPages > 1}">
                    <div class="pagination-info">
                        共 <strong th:text="${totalItems}">0</strong> 条记录，第 <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong> 页
                    </div>
                    <div class="pagination">
                        <a th:href="@{/admin/users(page=0, keyword=${keyword}, role=${role})}" th:classappend="${currentPage == 0} ? 'disabled'">«</a>
                        <a th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword}, role=${role})}" th:classappend="${currentPage == 0} ? 'disabled'">‹</a>
                        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:if="${i >= currentPage - 3 and i <= currentPage + 3}" th:href="@{/admin/users(page=${i}, keyword=${keyword}, role=${role})}" th:text="${i + 1}" th:classappend="${i == currentPage} ? 'active'"></a>
                        </th:block>
                        <a th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword}, role=${role})}" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">›</a>
                        <a th:href="@{/admin/users(page=${totalPages - 1}, keyword=${keyword}, role=${role})}" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">»</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
