<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: admin-head('商品表单')}"></head>
<body>
<div class="admin-container">
    <div th:replace="~{admin/fragments :: admin-sidebar('products')}"></div>

    <div class="main-content">
        <div class="page-header">
            <h1 th:text="${product != null ? '编辑商品' : '添加商品'}"></h1>
            <div class="header-actions">
                <a href="/admin/products" class="btn btn-secondary">← 返回列表</a>
            </div>
        </div>

        <div class="page-content">
            <div class="form-container" style="max-width: 700px;">
                <form action="/admin/product/save" method="post">
                    <input type="hidden" name="id" th:value="${product != null ? product.id : null}">

                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" name="name" th:value="${product != null ? product.name : ''}" required>
                    </div>

                    <div class="form-group">
                        <label>商品描述</label>
                        <textarea name="description" th:text="${product != null ? product.description : ''}" required></textarea>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label>价格</label>
                            <input type="number" name="price" step="0.01" th:value="${product != null ? product.price : ''}" required>
                        </div>

                        <div class="form-group">
                            <label>库存</label>
                            <input type="number" name="stock" th:value="${product != null ? product.stock : '0'}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>分类</label>
                        <select name="categoryId" required>
                            <option value="">请选择分类</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${product != null and product.categoryId == category.id}">
                            </option>
                        </select>
                    </div>

                    <div class="image-upload">
                        <label>商品图片</label>
                        <div class="image-preview">
                            <img th:src="${product != null ? product.imageUrl : ''}" th:style="${product != null and product.imageUrl != null and product.imageUrl != '' ? 'display: block;' : 'display: none;'}" id="previewImage" />
                            <span th:style="${product != null and product.imageUrl != null and product.imageUrl != '' ? 'display: none;' : 'display: block;'}" id="noImage">无图片</span>
                        </div>
                        <input type="file" id="fileInput" style="display: none;">
                        <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">📷 上传图片</button>
                        <input type="text" name="imageUrl" id="imageUrl" th:value="${product != null ? product.imageUrl : ''}" readonly>
                    </div>

                    <div class="form-group">
                        <label>状态</label>
                        <select name="status" required>
                            <option value="ON_SALE" th:selected="${product != null and product.status == 'ON_SALE'}">在售</option>
                            <option value="OFF_SALE" th:selected="${product != null and product.status == 'OFF_SALE'}">下架</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/admin/products" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="/js/fileUpload.js"></script>
</body>
</html>
