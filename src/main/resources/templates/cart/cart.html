<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('购物车')}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    
    <main class="main">
        <div class="container">
            <h2 style="margin-bottom: 20px;">购物车</h2>

            <!-- 添加成功/失败消息提示 -->
            <div th:if="${success}" class="message message-success" th:text="${success}"></div>
            <div th:if="${error}" class="message message-error" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
                <p>购物车是空的</p>
                <a href="/" class="btn">去购物</a>
            </div>
            
            <div th:if="${!#lists.isEmpty(cartItems)}">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>商品</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <div style="width: 60px; height: 60px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px;">
                                        <img th:if="${item.product.imageUrl != null and item.product.imageUrl != '' and imageExistsMap[item.product.id]}" 
                                             th:src="${item.product.imageUrl}" 
                                             style="max-width: 100%; max-height: 100%; object-fit: cover;" 
                                             alt="商品图片" 
                                             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'" />
                                        <span th:unless="${item.product.imageUrl != null and item.product.imageUrl != '' and imageExistsMap[item.product.id]}" 
                                              style="color: #999; font-size: 12px;">无图</span>
                                    </div>
                                    <a th:href="'/product?id=' + ${item.product.id}" class="product-link">
                                        <span th:text="${item.product.name}">商品名称</span>
                                    </a>
                                </div>
                            </td>
                            <td th:text="'¥' + ${item.product.price}">¥0.00</td>
                            <td>
                                <form action="/cart/update" method="post" style="display: flex; align-items: center; gap: 10px;">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="0" class="quantity-input">
                                    <button type="submit" class="btn btn-secondary" style="margin: 0;">更新</button>
                                </form>
                                <!-- 库存不足提示 -->
                                <div th:if="${item.quantity > item.product.stock}"
                                     style="color: #f44336; font-size: 12px; margin-top: 5px;">
                                    ⚠️ 库存不足（剩余：<span th:text="${item.product.stock}">0</span>）
                                </div>
                            </td>
                            <td th:text="'¥' + ${item.subtotal}">¥0.00</td>
                            <td>
                                <a th:href="'/cart/remove?id=' + ${item.id}" class="btn btn-secondary" style="background: #f44336;">删除</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="cart-total">
                    总计: <span class="order-total-amount" th:text="'¥' + ${total}">¥0.00</span>
                </div>

                <!-- 库存不足时显示警告 -->
                <div th:if="${!allStockSufficient}" class="message message-warning">
                    ⚠️ 部分商品库存不足，请调整购买数量后再结算
                </div>

                <div class="order-actions">
                    <a href="/cart/clear" class="btn btn-secondary">清空购物车</a>
                    <!-- 库存充足时显示正常链接 -->
                    <a th:if="${allStockSufficient}"
                       href="/order/confirm"
                       class="btn">去结算</a>
                    <!-- 库存不足时显示禁用按钮 -->
                    <button th:if="${!allStockSufficient}"
                            disabled
                            class="btn" style="background: #cccccc; color: #666666; cursor: not-allowed;">
                        去结算
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
        </div>
    </footer>
</body>
</html>
