<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${product.name})}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    
    <main class="main">
        <div class="container">
            <div style="display: flex; gap: 40px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <div style="flex: 1;">
                    <div style="width: 100%; height: 400px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #999; border-radius: 8px;">
                        <img th:if="${imageExists}" th:src="${product.imageUrl}" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;" />
                        <span th:unless="${imageExists}">商品图片</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <h1 th:text="${product.name}" style="margin-bottom: 20px;">商品名称</h1>
                    <p th:text="${product.description}" style="color: #666; margin-bottom: 20px;">商品描述</p>
                    <div style="font-size: 32px; color: #ff6700; font-weight: bold; margin-bottom: 20px;" th:text="'¥' + ${product.price}">¥0.00</div>
                    <div style="margin-bottom: 20px;">
                        <span style="color: #999;">库存: </span>
                        <span th:text="${product.stock}">0</span>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <span style="color: #999;">分类: </span>
                        <span th:text="${product.categoryName}">分类</span>
                    </div>
                    <form action="/cart/add" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                            <label>数量:</label>
                            <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" style="width: 80px; padding: 8px;">
                        </div>
                        <button type="submit" class="btn" style="padding: 12px 40px; font-size: 16px;">加入购物车</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
        </div>
    </footer>
</body>
</html>
