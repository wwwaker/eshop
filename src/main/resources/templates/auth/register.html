<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('用户注册')}"></head>
<body>
<div th:replace="~{layout :: header}"></div>
<script th:src="@{/js/register.js}"></script>

<main class="main">
    <div class="container">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 30px;">用户注册</h2>

            <div th:if="${error}" class="error" th:text="${error}"></div>

            <form action="/register" method="post" id="registerForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" id="username" required placeholder="请输入用户名" onblur="checkUsername()">
                    <div id="usernameHint" style="font-size: 12px; margin-top: 5px;"></div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" required placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>邮箱 <span style="color: red;">*</span></label>
                    <input type="email" name="email" id="email" required placeholder="请输入邮箱" onblur="checkEmail()">
                    <div id="emailHint" style="font-size: 12px; margin-top: 5px;"></div>
                </div>
                <div class="form-group">
                    <label>手机号 <span style="color: red;">*</span></label>
                    <input type="text" name="phone" id="phone" required placeholder="请输入手机号" onblur="checkPhone()">
                    <div id="phoneHint" style="font-size: 12px; margin-top: 5px;"></div>
                </div>
                <button type="submit" class="btn" style="width: 100%;" onclick="return validateForm()">注册</button>
        </form>

            <p style="text-align: center; margin-top: 20px;">
                已有账号？<a href="/login">立即登录</a>
            </p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 电子商城 - 基于 Spring MVC 开发</p>
    </div>
</footer>
</body>
</html>
